<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的故事小站</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&family=Roboto+Slab&family=Quicksand&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      margin: 0;
      background-color: #ff0000;
    }
    header {
      background-color: #5ff01c;
      color: rgb(219, 0, 0);
      text-align: center;
      padding: 30px 10px;
      text-shadow: -2px -2px 4px #6b8499;
      font-size: 32px;
      letter-spacing: 2px;
      font-family: 'Roboto Slab', serif;
    }
    .container {
      display: flex;
    }
    .left {
      width: 35%;
      background-color: #e02975;
      padding: 15px;
      text-align: center;
      font-family: 'Quicksand', sans-serif;
    }
    .left img {
      width: 90%;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .right {
      width: 65%;
      display: flex;
      flex-wrap: wrap;
      background-color: #c0faf0;
      padding: 10px;
    }
    .column {
      width: 50%;
      padding: 15px;
      box-sizing: border-box;
    }
    .column h3 {
      background-color: #ac033e;
      padding: 6px;
      font-weight: bold;
      border-left: 5px solid #c2185b;
      font-family: 'Roboto Slab', serif;
    }
    .column p, .column ul {
      font-family: 'Noto Sans TC', sans-serif;
    }
  </style>
</head>
<body>
  <header>不要放棄，勇敢面對</header>
  <div class="container">
    <div class="left">
      <h3>陳主恩</h3>
      <img src="atl_m_20190325154821_150.jpg" alt="我的照片">
    </div>
    <div class="right">
      <div class="column">
        <h3>今天努力的地方</h3>
        <p>在健身房裏面突破了自己的握推PR。</p>
      </div>
      <div class="column">
        <h3>最喜歡的人</h3>
        <p>"我的家人。"</p>
      </div>
      <div class="column">
        <h3>生活的小目標</h3>
        <ul>
          <li>努力把自己練壯</li>
          <li>養成讀書習慣</li>
          <li>交到女朋友</li>
        </ul>
      </div>
      <div class="column">
        <h3>想去的國家</h3>
        <ul>
        <li>德國。</li>
        <li>美國。</li>
        <li>法國。</li>
      </div>
    </div>
  </div>
</body>
</html>
